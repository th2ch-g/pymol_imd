[project]
name = "pymol_imd"
version = "0.1.0"
description = "Multiscale Interactive Molecular Dynamics in PyMOL (CG / AA / ML-MM)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "th2ch-g" }]
dependencies = []

[project.scripts]
pymol_imd = "pymol_imd.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymol_imd*"]

# ---------------------------------------------------------------------------
# pixi workspace
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
# Windows native is excluded: ambertools has no conda-forge Windows build.
# Windows users should run via WSL2 (linux-64).
platforms = ["linux-64", "osx-arm64", "osx-64"]

# ---------------------------------------------------------------------------
# Default feature: AA + CG (works on Linux & macOS)
# ---------------------------------------------------------------------------
[tool.pixi.dependencies]
python = ">=3.11,<3.13"
# Core MD + viewer
openmm = ">=8.1"
pymol-open-source = ">=3.0"
# Forcefield / ligand parameterization
ambertools = "*"
openmmforcefields = "*"
openff-toolkit = "*"
rdkit = "*"
# Coarse-grained (Martini) topology generation
vermouth = "*"
# MDTraj provides DSSP without the CLI version skew that breaks vermouth's
# external DSSP integration (DSSP 4 vs the 2.x/3.x vermouth was tested on).
mdtraj = "*"
# ML/MM stack (works on linux-64, osx-arm64, osx-64; MPS used on Apple Silicon)
pytorch = ">=2.6"
pytorch_scatter = "*"
pytorch_geometric = "*"
biopython = "*"
ase = "*"
parmed = "*"
# Misc utilities
numpy = "*"
requests = "*"

[tool.pixi.pypi-dependencies]
pymol_imd = { path = ".", editable = true }
# Martini reader for OpenMM (no conda-forge build available). Pinned to upstream main.
martini-openmm = { git = "https://github.com/maccallumlab/martini_openmm.git" }
# MACE MLIP backend (default for setup_mlmm). MACE-OMOL-0 is a public,
# login-free model so `pixi install` → `setup_mlmm` works out of the box;
# UMA stays available via `--ml-backend uma` but needs HF auth.
mace-torch = "*"
ruff = "*"

# Optional MLIP backends for setup_mlmm (MACE is the default and already
# installed above). Each of these has transitive deps (fairchem-core 2.x ->
# ray[serve] -> pydantic; orb-models -> torch C++ extensions; aimnet ->
# torch) that conflict with pixi's strict conda/pypi resolver, so they
# live in tasks instead of pypi-dependencies — pip's looser resolver
# installs them cleanly.
[tool.pixi.tasks]
ruff-format = "ruff format --force-exclude"
ruff-lint = "ruff check --fix --exit-non-zero-on-fix --force-exclude"
r = { cmd = "echo OK", depends-on = ["ruff-format", "ruff-lint"] }
smoke = "python -m pymol_imd.tests.smoke"
install-uma = "pip install --no-build-isolation 'fairchem-core>=2.20.0'"
install-orb = "pip install --no-build-isolation orb-models"
install-aimnet2 = "pip install --no-build-isolation aimnet"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
