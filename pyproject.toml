[project]
name = "pymol_imd"
version = "0.1.0"
description = "Multiscale Interactive Molecular Dynamics in PyMOL (CG / AA / ML-MM)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "th2ch-g" }]
dependencies = []

[project.scripts]
pymol_imd = "pymol_imd.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymol_imd*"]

# ---------------------------------------------------------------------------
# pixi workspace
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
# Windows native is excluded: ambertools has no conda-forge Windows build.
# Intel Mac (osx-64) is excluded: the AIMNet2 default backend pulls
# `warp-lang`, which has no osx-64 wheels. Windows / Intel-Mac users
# should run via WSL2 / a Linux VM respectively.
platforms = ["linux-64", "osx-arm64"]

# ---------------------------------------------------------------------------
# Default feature: AA + CG (works on Linux & macOS)
# ---------------------------------------------------------------------------
[tool.pixi.dependencies]
python = ">=3.11,<3.13"
# Core MD + viewer
openmm = ">=8.1"
pymol-open-source = ">=3.0"
# Forcefield / ligand parameterization
ambertools = "*"
openmmforcefields = "*"
openff-toolkit = "*"
rdkit = "*"
# Coarse-grained (Martini) topology generation
vermouth = "*"
# MDTraj provides DSSP without the CLI version skew that breaks vermouth's
# external DSSP integration (DSSP 4 vs the 2.x/3.x vermouth was tested on).
mdtraj = "*"
# ML/MM stack (works on linux-64, osx-arm64, osx-64; MPS used on Apple Silicon)
pytorch = ">=2.6"
pytorch_scatter = "*"
pytorch_geometric = "*"
biopython = "*"
ase = "*"
parmed = "*"
# Misc utilities
numpy = "*"
requests = "*"

[tool.pixi.pypi-dependencies]
pymol_imd = { path = ".", editable = true }
# Martini reader for OpenMM (no conda-forge build available). Pinned to upstream main.
martini-openmm = { git = "https://github.com/maccallumlab/martini_openmm.git" }
# MACE MLIP backend (default for setup_mlmm). MACE-OMOL-0 is a public,
# login-free model so `pixi install` → `setup_mlmm` works out of the box;
# UMA stays available via `--ml-backend uma` but needs HF auth.
# Default MLIP backends: pixi install brings MACE (mace-torch) and the
# default AIMNet2 (aimnet) in directly. ORB and UMA are excluded from the
# pypi lock because their dependency chains collide:
#   - orb-models pulls `cached-path` whose old `rich` / `filelock` requests
#     conflict with the conda-side pins
#   - fairchem-core (UMA) pins `e3nn>=0.5`, mace-torch pins `e3nn==0.4.4`
# These both install fine via pip's looser resolver, so we expose them
# through `pixi run install-orb` / `install-uma` tasks instead.
mace-torch = "*"
aimnet = "*"
ruff = "*"

# ---------------------------------------------------------------------------
# CUDA feature (Linux + NVIDIA only)
# ---------------------------------------------------------------------------
# Adds a separate `gpu` environment whose torch resolves to a CUDA build via
# the cuda system-requirement + pytorch-gpu metapackage. The `default`
# environment stays CPU-only and unchanged (separate solve-group), so
# macOS / CPU users are unaffected. CUDA inference is the single biggest ML/MM
# speedup (10-100x vs CPU). Build + run on linux-64 only:
#     pixi install -e gpu
#     pixi run -e gpu pymol_imd input.pdb --level mlmm --ml-selection "resi 30-50" --run
[tool.pixi.feature.cuda]
platforms = ["linux-64"]
system-requirements = { cuda = "12" }

[tool.pixi.feature.cuda.dependencies]
pytorch-gpu = "*"
cuda-version = "12.*"

[tool.pixi.environments]
gpu = ["cuda"]

[tool.pixi.tasks]
ruff-format = "ruff format --force-exclude"
ruff-lint = "ruff check --fix --exit-non-zero-on-fix --force-exclude"
r = { cmd = "echo OK", depends-on = ["ruff-format", "ruff-lint"] }
smoke = "python -m pymol_imd.tests.smoke"
# PYTHONUTF8=1: AIMNet2 reads its model-registry YAML with a plain open() (no
# encoding=), which crashes under a non-UTF-8 subprocess locale (UnicodeDecodeError
# on the em-dash in the registry). Force UTF-8 so the MLIP load is locale-robust.
smoke-mlmm = { cmd = "python -m pymol_imd.tests.smoke_mlmm", env = { PYTHONUTF8 = "1" } }
record-smoke = "python -m pymol_imd.tests.smoke_record"
smoke-socket = "python -m pymol_imd.tests.smoke_socket"
smoke-drag = "python -m pymol_imd.tests.smoke_drag"
install-uma = "pip install --no-build-isolation 'fairchem-core>=2.20.0'"
install-orb = "pip install --no-build-isolation orb-models"
# cuEquivariance acceleration for MACE. CUDA 12 + linux-64 only — run inside
# the gpu environment: `pixi run -e gpu install-cueq`. No-op on CPU/MPS.
install-cueq = "pip install --no-build-isolation cuequivariance cuequivariance-torch cuequivariance-ops-torch-cu12"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
